plugins { id "com.android.application" }

// Release signing reads ~/.lumacast/keystore.properties (never committed).
def ksFile = new File(System.getProperty("user.home"), ".lumacast/keystore.properties")
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace "app.lumacast"
    compileSdk 36
    ndkVersion "28.2.13676358"
    defaultConfig {
        applicationId "app.lumacast"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
        externalNativeBuild { cmake { arguments "-DANDROID_STL=c++_static" } }
    }
    signingConfigs {
        release {
            if (ks.storeFile) {
                storeFile file(ks.storeFile)
                storePassword ks.storePassword
                keyAlias ks.keyAlias
                keyPassword ks.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks.storeFile ? signingConfigs.release : signingConfigs.debug
            ndk { debugSymbolLevel "SYMBOL_TABLE" }
        }
    }
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
